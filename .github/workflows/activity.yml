name: GitHub Activity Graph

on:
  schedule: # Roz ek dafa update hoga
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub Activity Graph
        uses: ashutosh00710/github-readme-activity-graph@master
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          theme: github-dark
          output: dist/github-contribution-grid-snake-dark.svg
      - name: Push Graph to Output Branch
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout -b output
          git add dist/github-contribution-grid-snake-dark.svg
          git commit -m "Generated contribution graph"
          git push -f origin output
