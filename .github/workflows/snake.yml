name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"   # daily run at midnight
  workflow_dispatch:       # manual run allowed

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # 👈 important: allow pushing

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: IsrarSoomro60
          outputs: dist/snake.svg

      - name: Push to output branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: dist
          force_orphan: true
